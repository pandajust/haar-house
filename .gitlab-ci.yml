# 备用 GitLab CI 配置 - 用于自建 GitLab 镜像仓库
# 与 GitHub Actions 等价：install + lint + typecheck + build
# 使用 pnpm 9.12.0 + Node 22.x，缓存 pnpm store

stages:
  - install
  - verify
  - build
  - release

variables:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'
  PNPM_CACHE_DIR: '.pnpm-store'
  GIT_DEPTH: '0'

# 缓存 pnpm store，跨 job 复用
cache:
  key:
    files:
      - pnpm-lock.yaml
    prefix: $CI_JOB_NAME
  paths:
    - .pnpm-store
  policy: pull-push

.default_rules: &default_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop)$/
    - if: $CI_COMMIT_TAG =~ /^v/

# 安装依赖（独立 job，后续 verify/build 复用缓存产物）
install:
  <<: *default_rules
  stage: install
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir ${PNPM_CACHE_DIR}
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules

lint:
  <<: *default_rules
  stage: verify
  image: node:22-alpine
  needs: [install]
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm -r --filter=./apps/* lint

typecheck:
  <<: *default_rules
  stage: verify
  image: node:22-alpine
  needs: [install]
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm -r --filter=./apps/* typecheck

build:
  <<: *default_rules
  stage: build
  image: node:22-alpine
  needs: [install]
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm -r --filter=./apps/* build
  artifacts:
    expire_in: 7 days
    paths:
      - apps/*/dist
      - apps/*/.next
      - apps/*/build

