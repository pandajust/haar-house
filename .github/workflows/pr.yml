name: PR Check

# PR 专用流水线：在 ci.yml 基础上增加 PR 门禁校验
# 触发条件：PR opened / synchronize / reopened
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

# 同一 PR 的最新 push 取消旧 run
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PR 元数据校验：标题、关联 issue 等
  pr-meta:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: '^(?![A-Z]).+'
          subjectPatternError: |
            PR 标题需符合 Conventional Commits 规范，例如:
              feat: 添加会员卡储值扣减
              fix(server): 修复预约并发锁释放问题
              ci: 添加 GitHub Actions 流水线

  # PR 必须通过 lint / typecheck / build，任一失败阻塞合并
  lint:
    name: Lint (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-file: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm -r --filter=./apps/* lint

  typecheck:
    name: Typecheck (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-file: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -r --filter=./apps/* typecheck

  build:
    name: Build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-file: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r --filter=./apps/* build

  # PR 合并门禁：lint + typecheck + build 任一失败阻塞合并
  # 在 GitHub 仓库 Settings -> Branches -> Branch protection rules 启用:
  #   - Require status checks to pass before merging
  #   - Required status checks: pr-lint, pr-typecheck, pr-build (matrix 会展开为多个)
  #   - Require branches to be up to date before merging
